<script type="text/javascript">
  RED.nodes.registerType("AlarmUltimateSiren", {
    category: "Alarm Ultimate",
    color: "#E6C58A",
    defaults: {
      name: { value: "" },
      alarmId: { value: "", required: true },
      topic: { value: "" },
      outputInitialState: { value: true },
    },
    inputs: 0,
    outputs: 1,
    icon: "alarm-ultimate-siren.svg",
    label: function () {
      const selfLabel = this.name || "Alarm Siren";
      try {
        const alarm = this.alarmId ? RED.nodes.node(this.alarmId) : null;
        const alarmLabel = alarm ? (alarm.name || alarm.id || "") : "";
        return alarmLabel ? `${alarmLabel} - ${selfLabel}` : selfLabel;
      } catch (_err) {
        return selfLabel;
      }
    },
    paletteLabel: function () {
      return "Alarm Siren";
    },
    oneditprepare: function () {
      const alarmSelect = $("#node-input-alarmId");

      const nodes = [];
      try {
        RED.nodes.eachNode((n) => {
          if (n && n.type === "AlarmSystemUltimate") {
            nodes.push({ id: n.id, name: String(n.name || "") });
          }
        });
      } catch (_err) { }
      nodes.sort((a, b) => (a.name || a.id).localeCompare(b.name || b.id));
      alarmSelect.empty();
      alarmSelect.append($("<option></option>").attr("value", "").text("-- select --"));
      nodes.forEach((n) => {
        const label = n.name ? `${n.name} (${n.id})` : n.id;
        alarmSelect.append($("<option></option>").attr("value", n.id).text(label));
      });
      if (this.alarmId) alarmSelect.val(this.alarmId);
    },
  });
</script>

<script type="text/html" data-template-name="AlarmUltimateSiren">
  <div class="form-row">
    <label>VIDEO</label>
    <a
      target="_blank"
      rel="noopener noreferrer"
      href="https://youtube.com/playlist?list=PL9Yh1bjbLAYrybBZKykfKLDrRAspj9to4&amp;si=j0mLqVMBcHKjBpNY"
    ><i class="fa fa-youtube-play" style="color:#cc0000;"></i> See it on YouTube</a>
  </div>

  <div class="form-row">
    <label for="node-input-name"><i class="icon-tag"></i> Name</label>
    <input type="text" id="node-input-name" placeholder="Name" />
  </div>

  <div class="form-row">
    <label for="node-input-alarmId"><i class="fa fa-link"></i> Alarm node</label>
    <select id="node-input-alarmId" style="width: 70%"></select>
  </div>

  <div class="form-row">
    <label for="node-input-topic"><i class="fa fa-tag"></i> Topic</label>
    <input type="text" id="node-input-topic" placeholder="(default: &lt;controlTopic&gt;/siren)" />
  </div>

  <div class="form-row">
    <label for="node-input-outputInitialState"><i class="fa fa-bolt"></i> Emit on deploy</label>
    <input type="checkbox" id="node-input-outputInitialState" style="width:auto; margin-top:7px;" />
  </div>
</script>

<script type="text/markdown" data-help-name="AlarmUltimateSiren">
Emits the siren state from a selected **Alarm System Ultimate** node.

Quick start:

1. Select the Alarm node.
2. Connect this node to a **Debug** (or an automation).

Output message (same format as the Alarm node siren output):

- `msg.topic`: configurable (default: `controlTopic + "/siren"`)
- `msg.event`: `siren_on` or `siren_off`
- `msg.payload`: `true` when the siren is on, otherwise `false`
- `msg.reason`: `manual|timeout|arm|disarm|...`
- `msg.alarmUltimate`: optional standard object with extra alarm details

Notes:

- No wire from the Alarm node is required: just select the Alarm node in this editor.
</script>
