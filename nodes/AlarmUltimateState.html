<script type="text/javascript">
  RED.nodes.registerType("AlarmUltimateState", {
    category: "Alarm Ultimate",
    color: "#E8D6AA",
    defaults: {
      name: { value: "" },
      alarmId: { value: "", required: true },
      io: { value: "out" },
      adapter: { value: "default" },
      topic: { value: "" },
      outputInitialState: { value: true },
    },
    inputs: 0,
    outputs: 1,
    onadd: function () {
      const inputMode = String(this.io || "out") === "in";
      this.inputs = inputMode ? 1 : 0;
      this.outputs = inputMode ? 0 : 1;
      this.wires = Array.isArray(this.wires) ? this.wires : [];
      if (this.outputs === 0) this.wires = [];
      if (this.outputs === 1 && this.wires.length === 0) this.wires.push([]);
    },
    icon: "alarm-ultimate-state.svg",
    label: function () {
      const selfLabel = this.name || "Alarm State";
      try {
        const alarm = this.alarmId ? RED.nodes.node(this.alarmId) : null;
        const alarmLabel = alarm ? (alarm.name || alarm.id || "") : "";
        return alarmLabel ? `${alarmLabel} - ${selfLabel}` : selfLabel;
      } catch (_err) {
        return selfLabel;
      }
    },
    paletteLabel: function () {
      return "Alarm State";
    },
    oneditprepare: function () {
      const alarmSelect = $("#node-input-alarmId");
      const ioSelect = $("#node-input-io");
      const topicRow = $("#au-row-topic");
      const initRow = $("#au-row-outputInitialState");

      function refreshVisibility() {
        const mode = String(ioSelect.val() || "out");
        const isOut = mode === "out";
        topicRow.toggle(isOut);
        initRow.toggle(isOut);
      }

      const nodes = [];
      try {
        RED.nodes.eachNode((n) => {
          if (n && n.type === "AlarmSystemUltimate") {
            nodes.push({ id: n.id, name: String(n.name || "") });
          }
        });
      } catch (_err) { }
      nodes.sort((a, b) => (a.name || a.id).localeCompare(b.name || b.id));
      alarmSelect.empty();
      alarmSelect.append($("<option></option>").attr("value", "").text("-- select --"));
      nodes.forEach((n) => {
        const label = n.name ? `${n.name} (${n.id})` : n.id;
        alarmSelect.append($("<option></option>").attr("value", n.id).text(label));
      });
      if (this.alarmId) alarmSelect.val(this.alarmId);

      ioSelect.off("change").on("change", refreshVisibility);
      refreshVisibility();
    },
    oneditsave: function () {
      const io = String($("#node-input-io").val() || "out");
      this.inputs = io === "in" ? 1 : 0;
      this.outputs = io === "out" ? 1 : 0;
      const outputs = io === "out" ? 1 : 0;
      this.wires = Array.isArray(this.wires) ? this.wires : [];
      if (outputs === 0) {
        this.wires = [];
      } else if (this.wires.length < outputs) {
        while (this.wires.length < outputs) this.wires.push([]);
      } else if (this.wires.length > outputs) {
        this.wires = this.wires.slice(0, outputs);
      }
    },
  });
</script>

<script type="text/markdown" data-help-name="AlarmUltimateState">
Alarm State can work in two modes:

- **Output**: emits alarm state-related events from a selected **Alarm System Ultimate** node.
- **Input**: receives messages from the flow and injects alarm commands into the selected Alarm node.

Quick start:

1. Select the Alarm node.
2. Choose **Mode** and **Adapter**.
3. Connect this node to a **Debug** (or to your integration nodes).

Output message (same format as the Alarm node `.../event` output):

- `msg.topic`: configurable (default: `controlTopic + "/event"`)
- `msg.event`: one of `arming`, `armed`, `disarmed`, `reset`, `entry_delay`, `alarm`
- `msg.payload`: `true|false` (armed/active boolean)
- `msg.mode`: `armed|disarmed`
- other event fields (reason, seconds, violations, ...) are emitted as **root properties** on `msg`
- `msg.alarmUltimate`: optional standard object with extra alarm details

Notes:

- No wire from the Alarm node is required: just select the Alarm node in this editor.

## Input mode details

In **Input** mode this node injects an arm/disarm command into the selected Alarm node.

### Homekit

This adapter accepts typical HomeKit Security System payloads and converts them to `arm` / `disarm`.

Examples:

```json
{ "payload": { "SecuritySystemTargetState": 1 } }
```

- `0|1|2` → `arm` (Stay/Away/Night)
- `3` → `disarm`

### Home Assistant

This adapter accepts the command payloads sent by a Home Assistant `alarm_control_panel` (MQTT or template), as a plain string or under `msg.payload.action`/`command`/`state`:

- `ARM_AWAY` / `ARM_VACATION` / `ARM_CUSTOM_BYPASS` → `arm`
- `ARM_HOME` / `ARM_NIGHT` → `arm` (the requested mode is remembered for the output state)
- `DISARM` → `disarm`
- `TRIGGER` → `panic`

An optional `msg.payload.code` is forwarded as the alarm `code`.

### Default / KNX-Ultimate

- Default adapter infers `arm`/`disarm` from `msg.payload` when it is a boolean/number/string.
- With **KNX-Ultimate** you can also pass the group address via `msg.knx.destination` (it overrides `msg.topic`).

### Ax Pro (Hikvision Ultimate)

This adapter expects the CID event payload emitted by AX Pro, for example:

```json
{
  "payload": {
    "CIDEvent": {
      "code": 3401
    }
  }
}
```

Only arming/disarming CID codes are handled (other CID events are ignored):

- `3401` → `arm` (Away)
- `3441` → `arm` (Stay)
- `1401` → `disarm`

## Adapter output behavior

- **Default / Ax Pro**: keeps a boolean `msg.payload` and emits details as root properties.
- **Homekit**: emits `msg.SecuritySystemTargetState` and `msg.SecuritySystemCurrentState` as root properties (while keeping boolean `msg.payload`).
- **Home Assistant**: sets `msg.payload` to a HA `alarm_control_panel` state string (`disarmed`, `arming`, `pending`, `triggered`, `armed_away`, `armed_home`). Wire it to an `mqtt out` on the panel's `state_topic`.
- **KNX-Ultimate**: outputs a boolean `msg.payload` and sets `msg.destination` (defaults to `msg.topic`).
</script>
