<script type="text/markdown" data-help-name="AlarmUltimateMqtt-config">
  <p>Shared MQTT broker configuration for <b>Alarm System</b> nodes.</p>

  All Alarm System nodes that reference this configuration share a **single MQTT connection**,
  instead of each opening its own. Configure the broker once here, then select it in the
  **MQTT / HA** tab of every Alarm System node.

  ## Settings

  | Setting          | Description                                                                                                       |
  | ---------------- | ----------------------------------------------------------------------------------------------------------------- |
  | Broker URL       | e.g. `mqtt://localhost:1883` (use `mqtts://` for TLS).                                                              |
  | Username/Password| Optional; stored as Node-RED credentials.                                                                           |
  | Base topic       | All alarm topics live under it: each panel publishes to `<base>/<name>/…` (default `alarm-ultimate`).               |
  | Discovery prefix | Home Assistant MQTT Discovery prefix (default `homeassistant`).                                                     |

  ## Availability / Last Will

  The connection tracks its own availability on `<base>/_bridge/availability` (`online`/`offline`,
  retained, with Last Will). Each Alarm panel additionally has its own
  `<base>/<name>/availability` topic; Home Assistant discovery references **both**, so entities go
  unavailable when either the whole connection drops or that single panel is removed. Zones with
  **sensor supervision** enabled also get a per-zone `<base>/<name>/zone/<zone>/availability`
  topic, so a missing sensor shows as Unavailable in Home Assistant.

  ## Notes

  - The connection is opened when the first Alarm node using it starts, and closed when the last
    one stops.
  - Give each Alarm System node a unique **name**: topics and Home Assistant ids are derived from
    it, so unique names keep panels sharing this broker cleanly separated.
</script>
